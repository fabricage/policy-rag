# Render Blueprint for Meridian Software Policy RAG
# Docs: https://render.com/docs/blueprint-spec
#
# Uses a slim requirements file + ONNX embeddings so the free tier (~512MB)
# is less likely to OOM. If it still restarts, upgrade the plan to Standard (2GB).

services:
  - type: web
    name: meridian-policy-rag
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements-render.txt && python ingest.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --max-requests 200 --max-requests-jitter 40
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: EMBEDDING_BACKEND
        value: onnx
      # Keep CPU/allocator pressure low on free-tier memory limits
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: FLASK_DEBUG
        value: "0"
