# Render Blueprint for Meridian Software Policy RAG
# Docs: https://render.com/docs/blueprint-spec
#
# After merging: Dashboard → New → Blueprint → connect this repo → set ANTHROPIC_API_KEY.

services:
  - type: web
    name: meridian-policy-rag
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      # Keep CPU thread pools small on free-tier memory limits
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: FLASK_DEBUG
        value: "0"
